name: RAUI CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: raui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: RAUI CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm observability:check
      - run: pnpm security:check
      - run: pnpm build
      - name: Runtime image build and contract
        run: |
          node scripts/runtime-image-build.mjs --site-url http://127.0.0.1:3000 --environment staging
          RUNTIME_IMAGE_ID=$(docker image inspect --format '{{.Id}}' raui-runtime:local)
          docker run --rm --network=none --entrypoint node "$RUNTIME_IMAGE_ID" scripts/runtime-image-check.mjs
          mkdir -p .cache
          printf '%s\n' "$RUNTIME_IMAGE_ID" > .cache/runtime-image-id
      - run: cp .env.example .env && pnpm infra:up
      - run: pnpm test:integration
      - name: Runtime image service smoke
        run: |
          RUNTIME_IMAGE_ID=$(cat .cache/runtime-image-id)
          node --env-file=.env scripts/runtime-image-smoke.mjs "$RUNTIME_IMAGE_ID"
      - run: pnpm --filter @raui/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
        env:
          PGOPTIONS: -c log_min_duration_statement=100
      - run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm recovery:drill
      - name: Production smoke
        run: |
          pnpm --filter @raui/api start > /tmp/api.log 2>&1 &
          API_PID=$!
          pnpm --filter @raui/web start > /tmp/web.log 2>&1 &
          WEB_PID=$!
          pnpm worker:media > /tmp/media-worker.log 2>&1 &
          MEDIA_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" "$MEDIA_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null && curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          pnpm smoke
          pnpm smoke:core
          pnpm worker:commerce --once
          pnpm worker:professional --once
          pnpm worker:trust --once
          pnpm search:reconcile
          pnpm smoke:search
      - name: Prepare accepted local runtime image
        run: |
          set -o pipefail
          RUNTIME_IMAGE_ID=$(cat .cache/runtime-image-id)
          docker save "$RUNTIME_IMAGE_ID" | gzip > .cache/runtime-image.tar.gz
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, createReadStream } from 'node:fs';
          import { createHash } from 'node:crypto';
          const imageId = readFileSync('.cache/runtime-image-id', 'utf8').trim();
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const metadata = JSON.parse(execFileSync('docker', ['image', 'inspect', imageId], {encoding: 'utf8'}))[0];
          if (metadata.Id !== imageId || metadata.Config.Labels['org.opencontainers.image.revision'] !== revision || metadata.Config.Labels['raui.source-state'] !== 'committed') throw Error('Runtime source/image identity mismatch');
          const archiveHash = createHash('sha256');
          for await (const chunk of createReadStream('.cache/runtime-image.tar.gz')) archiveHash.update(chunk);
          const archiveSha256 = archiveHash.digest('hex');
          writeFileSync('.cache/runtime-image-receipt.json', JSON.stringify({version: 1, sourceRevision: revision, imageId, archiveSha256, sourceState: 'committed', siteUrl: metadata.Config.Labels['raui.site-url'], deploymentEnvironment: metadata.Config.Labels['raui.deployment-env'], ciRunId: process.env.GITHUB_RUN_ID, contract: 'passed', serviceSmoke: 'passed', migrationCount: 17, network: 'linux-host', adapters: 'local-development', stagingAcceptance: 'not_executed', deployment: 'not_executed'}, null, 2) + '\n');
          JS
          cd .cache
          sha256sum runtime-image.tar.gz runtime-image-receipt.json > runtime-image-sha256.txt
      - name: Restore saved runtime archive
        run: |
          set -o pipefail
          node scripts/runtime-image-archive.mjs "$(git rev-parse HEAD)" "$GITHUB_RUN_ID"
          RUNTIME_IMAGE_ID=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; process.stdout.write(JSON.parse(readFileSync(".cache/runtime-image-receipt.json", "utf8")).imageId)')
          [[ "$RUNTIME_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker image rm -f "$RUNTIME_IMAGE_ID"
          if docker image inspect "$RUNTIME_IMAGE_ID" > /dev/null 2>&1; then
            echo 'Original runtime image still present before archive restore' >&2
            exit 1
          fi
          gzip -dc .cache/runtime-image.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' "$RUNTIME_IMAGE_ID")" = "$RUNTIME_IMAGE_ID"
          docker run --rm --network=none --entrypoint node "$RUNTIME_IMAGE_ID" scripts/runtime-image-check.mjs
      - name: Release and rollback artifact dry-run
        run: |
          node scripts/release-contract.mjs create .cache/phase4d-release.json "$(git rev-parse HEAD)"
          pnpm release:verify .cache/phase4d-release.json "$(git rev-parse HEAD)"
      - name: Preserve verified readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: raui-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .cache/phase4d-release.json
            .cache/phase4d-load.json
            .cache/phase4d-recovery.json
            .cache/runtime-image-receipt.json
            apps/api/dist
            apps/api/migrations
            apps/web/.next
            !apps/web/.next/cache
            infra/observability
            pnpm-lock.yaml
            package.json
      - name: Upload accepted local runtime image
        uses: actions/upload-artifact@v4
        with:
          name: raui-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            .cache/runtime-image.tar.gz
            .cache/runtime-image-receipt.json
            .cache/runtime-image-sha256.txt
      - name: Diagnostics
        if: failure()
        run: |
          cat .cache/phase4d-e2e-summary.json 2>/dev/null || true
          docker compose --env-file .env.example -f infra/compose.yaml logs --no-color postgres | node scripts/sql-load-diagnostics.mjs
      - name: Safe E2E failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raui-e2e-failure-summary
          path: .cache/phase4d-e2e-summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down || true

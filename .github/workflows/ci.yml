name: RAUI CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: raui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm observability:check
      - run: pnpm security:check
      - run: pnpm build
      - run: cp .env.example .env && pnpm infra:up
      - run: pnpm test:integration
      - run: pnpm --filter @raui/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm recovery:drill
      - name: Production smoke
        run: |
          pnpm --filter @raui/api start > /tmp/api.log 2>&1 &
          API_PID=$!
          pnpm --filter @raui/web start > /tmp/web.log 2>&1 &
          WEB_PID=$!
          pnpm worker:media > /tmp/media-worker.log 2>&1 &
          MEDIA_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" "$MEDIA_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null && curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          pnpm smoke
          pnpm smoke:core
          pnpm worker:commerce --once
          pnpm worker:professional --once
          pnpm worker:trust --once
          pnpm search:reconcile
          pnpm smoke:search
      - name: Release and rollback artifact dry-run
        run: |
          node scripts/release-contract.mjs create .cache/phase4d-release.json "$(git rev-parse HEAD)"
          pnpm release:verify .cache/phase4d-release.json "$(git rev-parse HEAD)"
      - name: Preserve verified readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: raui-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .cache/phase4d-release.json
            .cache/phase4d-load.json
            .cache/phase4d-recovery.json
            apps/api/dist
            apps/api/migrations
            apps/web/.next
            !apps/web/.next/cache
            infra/observability
            pnpm-lock.yaml
            package.json
      - name: Diagnostics
        if: failure()
        run: cat .cache/phase4d-e2e-summary.json 2>/dev/null || true
      - name: Safe E2E failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raui-e2e-failure-summary
          path: .cache/phase4d-e2e-summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down || true

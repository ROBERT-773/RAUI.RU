# Reference contract; bind an actual private HTTPS target and read-only operator
# session token file using the approved secret mechanism before staging activation.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: raui-api
    metrics_path: /v1/admin/operations/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/raui-observer-session
    static_configs:
      - targets: [staging-api.raui.invalid]
